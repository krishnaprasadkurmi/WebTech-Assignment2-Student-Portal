<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Registration</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <div class="eyebrow">STUDENT ADMISSION PORTAL</div>
    <h1>Student Registration</h1>
    <p class="intro">Enter your details carefully. Fields marked * are required.</p>

    <form id="registrationForm" novalidate>
      <div class="grid">
        <label>Full name *
          <input id="name" name="name" type="text" placeholder="e.g. Krishna Prasad Kurmi" required>
          <small class="error" id="nameError"></small>
        </label>
        <label>Roll number *
          <input id="roll" name="roll" type="text" placeholder="e.g. CSE2026001" required>
          <small class="error" id="rollError"></small>
        </label>
        <label>Email address *
          <input id="email" name="email" type="email" placeholder="you@example.com" required>
          <small class="error" id="emailError"></small>
        </label>
        <label>Course *
          <select id="course" name="course" required>
            <option value="">Select a course</option>
            <option>Computer Science and Engineering</option>
            <option>Information Technology</option>
            <option>Electronics and Communication Engineering</option>
            <option>Electrical and Electronics Engineering</option>
            <option>Mechanical Engineering</option>
          </select>
          <small class="error" id="courseError"></small>
        </label>
        <label>Password *
          <input id="password" name="password" type="password" placeholder="At least 8 characters" required>
          <small class="hint">Use 8+ characters, uppercase, lowercase, and a number.</small>
          <small class="error" id="passwordError"></small>
        </label>
        <label>Confirm password *
          <input id="confirmPassword" name="confirmPassword" type="password" placeholder="Re-enter password" required>
          <small class="error" id="confirmPasswordError"></small>
        </label>
      </div>

      <label class="file-label">Profile image or document *
        <input id="document" name="document" type="file" accept=".jpg,.jpeg,.png,.pdf" required>
        <small class="hint">Allowed: JPG, PNG, PDF. Maximum size: 2 MB.</small>
        <small class="error" id="documentError"></small>
      </label>

      <button type="submit">Validate registration <span aria-hidden="true">→</span></button>
      <p id="successMessage" class="success" role="status"></p>
    </form>
  </main>
  <script src="script.js"></script>
</body>
</html>
